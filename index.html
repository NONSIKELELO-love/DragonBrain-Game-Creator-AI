<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DragonBrain Game Creator AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #151c35;
      border-bottom: 1px solid #2c365c;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #aeb8d8;
      margin: 8px 0 0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .card {
      background: #151c35;
      border: 1px solid #2c365c;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    textarea,
    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #3b4770;
      background: #0d1429;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #6c5ce7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5848d6;
    }

    .templates {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
